architectury {
    common(rootProject.enabled_platforms.split(","))
}

repositories {
}

dependencies {
    // fabric-loader is only here so the common source set can see the mixin/@Environment annotations.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // Cloth Config API for the shared config screen (provided at runtime by each loader).
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
